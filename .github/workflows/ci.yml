name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  consumer-smoke-test:
    name: Consumer smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # Packs the SDK, installs the tarball into a throwaway project, and
      # verifies the public API type-checks + redaction fires — i.e. exactly
      # what a customer experiences. Catches missing exports, broken `exports`
      # maps, raw-TS publishing, and leaked internal references before release.
      - run: npm run smoke-test

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # [dev,adk], not [dev]: tests/test_adk_plugin.py opens with
      # pytest.importorskip("google.adk"), so without the adk extra every ADK test SKIPS and the
      # plugin ships with no CI coverage at all — a green check that proves nothing about it.
      - run: pip install -e ".[dev,adk]"
      - run: ruff check .
      - run: mypy --strict g8r_shield
      # tests/test_adk_extra_installed.py fails (not skips) under CI=true if the adk extra is
      # missing, so this can never quietly regress to a green check over skipped tests.
      - run: pytest

  receipts:
    name: Signed decision receipts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: js
      - run: pip install -r requirements-receipts-test.txt
      # Generates test-vectors/ (not committed), compiles js/src/receipts.ts,
      # then runs the Node and Python receipt suites against those fixtures.
      - run: python tools/run_receipt_tests.py
